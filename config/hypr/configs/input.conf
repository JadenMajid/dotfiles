#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = -0.4
    touchpad {
        natural_scroll = false
    }
}

gestures {
    # 2026 unified syntax: gesture = FINGERS, DIRECTION, ACTION
    gesture = 3, horizontal, workspace
    workspace_swipe_distance = 700
}

device {
    name = epic-mouse-v1
    sensitivity = -0.8
}
