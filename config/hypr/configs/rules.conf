##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps.
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule {
  name = xwayland-drag-fix
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
  no_focus = on
}

# Anyrun instant appearance (2026 syntax)
windowrule {
  name = anyrun-no-anim
  match:class = ^(anyrun)$
  no_anim = on
}

# Smart gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

windowrule {
  name = no-gaps-window
  border_size = 0
  rounding = 0
  match:float = 0
  match:workspace = w[tv1]
}

windowrule {
  name = no-gaps-fullscreen
  border_size = 0
  rounding = 0
  match:float = 0
  match:workspace = f[1]
}

# Special workspaces
workspace = special:monitor#, on-created-empty:kitty -e bmon & kitty -e htop & pavucontrol
workspace = special:music, on-created-empty:$music
workspace = special:steam, on-created-empty:steam
workspace = special:discord, on-created-empty:discord
