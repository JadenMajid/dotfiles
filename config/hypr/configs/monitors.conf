################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=DP-1,2560x1440@165.00,auto,1,bitdepth,10

# NVIDIA & High-Refresh Optimizations (2026 standards)
render {
    new_render_scheduling = true
}

cursor {
    no_hardware_cursors = false # Set to false with explicit sync (default in 2026)
    sync_gsettings_theme = true
    inactive_timeout = 3
}

misc {
    vrr = 2
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    force_default_wallpaper = 1
    disable_hyprland_logo = true
}
